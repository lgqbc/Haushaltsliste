<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haushaltsliste</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Haushaltsliste">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151516" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f8a73'/%3E%3Cpath d='M18 33l9 9 19-20' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="touchIcon" href="">
<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --text: #262522;
    --muted: #8b877f;
    --faint: #b9b5ac;
    --line: #e8e4db;
    --accent: #4f8a73;
    --accent-text: #ffffff;
    --accent-soft: #e4efe9;
    --danger: #b5544a;
    --danger-soft: #f6e4e1;
    --shadow: 0 1px 2px rgba(40, 35, 25, .05), 0 2px 8px rgba(40, 35, 25, .04);
    --backdrop: rgba(30, 28, 24, .28);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151516;
      --card: #232325;
      --text: #ecebe7;
      --muted: #8f8d87;
      --faint: #5c5b58;
      --line: #313133;
      --accent: #7cbfa3;
      --accent-text: #10201a;
      --accent-soft: #1e302a;
      --danger: #e0857b;
      --danger-soft: #3a2422;
      --shadow: none;
      --backdrop: rgba(0, 0, 0, .5);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 19px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
  button:disabled { cursor: default; }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding:
      calc(env(safe-area-inset-top) + 18px)
      calc(env(safe-area-inset-right) + 16px)
      calc(env(safe-area-inset-bottom) + 120px)
      calc(env(safe-area-inset-left) + 16px);
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 52px;
    margin-bottom: 10px;
  }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
  .editBtn {
    min-width: 48px; height: 48px;
    border-radius: 24px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted);
    padding: 0 12px;
  }
  .editBtn svg { width: 24px; height: 24px; }
  .editBtn.on {
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
    padding: 0 20px;
  }

  h2 {
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin: 30px 4px 12px;
  }

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }

  .card {
    background: var(--card);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    min-height: 66px;
    padding: 12px 16px 12px 18px;
    text-align: left;
  }
  .emoji {
    font-size: 27px;
    width: 34px;
    flex: none;
    text-align: center;
    line-height: 1;
  }
  .emoji.empty::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--faint); vertical-align: middle; }
  .name { flex: 1; font-size: 20px; font-weight: 500; overflow-wrap: anywhere; }

  .mark {
    flex: none;
    width: 34px; height: 34px;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .mark svg { width: 18px; height: 18px; }

  /* Pool */
  .pool .mark { color: var(--faint); border: 2px solid var(--line); }
  .pool .row:active { background: var(--accent-soft); }

  /* Active */
  .active .card { background: var(--accent-soft); box-shadow: none; }
  .active .name { font-size: 22px; font-weight: 600; }
  .active .emoji { font-size: 30px; }
  .active .card { display: flex; flex-wrap: wrap; align-items: center; }
  .active .main { flex: 1; min-width: 0; }
  .active .text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .note-text { font-size: 17px; color: var(--muted); overflow-wrap: anywhere; }
  .active .main { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .active .card { transition: transform .15s ease, background-color .15s ease; }
  .active .card.pressing { transform: scale(.98); background: var(--card); }
  .note {
    display: block;
    flex-basis: 100%;
    width: calc(100% - 84px);
    margin: -6px 18px 12px 66px;
    padding: 4px 0 6px;
    border: 0;
    border-bottom: 1.5px solid transparent;
    background: transparent;
    font-size: 18px;
    color: var(--text);
    outline: none;
    border-radius: 0;
  }
  .note::placeholder { color: var(--muted); opacity: .75; }
  .note:focus { border-bottom-color: var(--accent); }

  .empty-state {
    color: var(--muted);
    text-align: center;
    padding: 26px 12px;
    border: 2px dashed var(--line);
    border-radius: 18px;
    font-size: 18px;
  }

  /* Edit mode */
  .editList .row { padding-right: 8px; }
  .editList .edit-open { display: flex; align-items: center; gap: 14px; flex: 1; min-height: 50px; text-align: left; }
  .arrow {
    flex: none;
    width: 44px; height: 44px;
    border-radius: 12px;
    color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .arrow svg { width: 22px; height: 22px; }
  .arrow:disabled { opacity: .25; }
  .arrow:not(:disabled):active { background: var(--line); }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    min-height: 58px;
    border-radius: 16px;
    font-size: 19px;
    font-weight: 600;
    background: var(--card);
    box-shadow: var(--shadow);
  }
  .btn svg { width: 22px; height: 22px; }
  .btn.primary { background: var(--accent); color: var(--accent-text); box-shadow: none; }
  .btn.ghost { background: transparent; box-shadow: none; color: var(--muted); }
  .btn.dashed { background: transparent; box-shadow: none; border: 2px dashed var(--line); color: var(--muted); }
  .btn.danger { background: transparent; box-shadow: none; color: var(--danger); }
  .btn.danger.confirm { background: var(--danger); color: #fff; }
  .btn:disabled { opacity: .4; }
  .btn-row { display: grid; gap: 10px; }
  .btn-row.two { grid-template-columns: 1fr 1fr; }

  .hint { color: var(--muted); font-size: 16px; text-align: center; margin: 12px 0 0; }

  /* Sheet */
  .backdrop {
    position: fixed; inset: 0;
    background: var(--backdrop);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 20;
    animation: fade .18s ease-out;
  }
  .sheet {
    width: 100%;
    max-width: 560px;
    background: var(--bg);
    border-radius: 24px 24px 0 0;
    padding: 22px calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 20px) calc(env(safe-area-inset-left) + 18px);
    animation: up .22s cubic-bezier(.2,.8,.2,1);
    max-height: 92vh;
    overflow-y: auto;
  }
  .sheet h3 { margin: 0 0 18px; font-size: 22px; font-weight: 700; text-align: center; }
  .sheet p { margin: 0 0 20px; text-align: center; color: var(--muted); }
  .fields { display: flex; gap: 10px; margin-bottom: 18px; }
  .field {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 16px;
    min-height: 62px;
    padding: 0 16px;
    font-size: 20px;
    outline: none;
    width: 100%;
  }
  .field:focus { border-color: var(--accent); }
  .field.emoji-in { width: 72px; flex: none; text-align: center; font-size: 28px; padding: 0; }
  .sheet .btn-row { margin-top: 6px; }

  /* Toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 20px);
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 528px;
    background: var(--text);
    color: var(--bg);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 6px 6px 6px 20px;
    min-height: 60px;
    z-index: 30;
    animation: up .2s ease-out;
    font-size: 18px;
  }
  .toast button {
    color: var(--bg);
    font-weight: 700;
    padding: 0 16px;
    min-height: 48px;
    border-radius: 12px;
  }
  .toast.warn { background: var(--danger); color: #fff; }

  /* Install banner */
  .install {
    display: flex; align-items: center; gap: 12px;
    background: var(--card);
    box-shadow: var(--shadow);
    border-radius: 18px;
    padding: 12px 8px 12px 18px;
    margin-bottom: 8px;
    font-size: 17px;
    color: var(--muted);
  }
  .install .txt { flex: 1; }
  .install b { color: var(--text); font-weight: 600; }
  .install .share { display: inline-block; width: 20px; height: 20px; vertical-align: -3px; color: var(--accent); }
  .install .x { width: 44px; height: 44px; flex: none; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
  .install .x svg { width: 20px; height: 20px; }

  .hidden { display: none !important; }

  @keyframes fade { from { opacity: 0; } }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } }
  .toast { animation-name: toastIn; }
  @keyframes toastIn { from { transform: translate(-50%, 16px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Haushaltsliste</h1>
    <button class="editBtn" id="editBtn" aria-label="Bearbeiten"></button>
  </header>

  <div id="install" class="install hidden">
    <div class="txt">Als App: <svg class="share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg> tippen, dann <b>„Zum Home-Bildschirm“</b></div>
    <button class="x" id="installClose" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <main id="main"></main>
</div>

<input type="file" id="fileIn" class="hidden">

<script>
(() => {
  'use strict';

  /* ---------- Icons ---------- */
  const ICON = {
    pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19h14"/></svg>',
    load: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M5 19h14"/></svg>'
  };

  /* ---------- State & storage ---------- */
  const KEY = 'haushaltsliste.v1';
  const KEY_PREV = 'haushaltsliste.v1.prev';
  const KEY_INSTALL = 'haushaltsliste.installHintClosed';

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  const defaults = () => ({
    v: 1,
    updated: 0,
    tasks: [
      { id: uid(), name: 'Geschirrspüler', emoji: '🍽️' },
      { id: uid(), name: 'Pflanzen gießen', emoji: '🌱' },
      { id: uid(), name: 'Müll rausbringen', emoji: '🗑️' },
      { id: uid(), name: 'Dinge irgendwo runterholen', emoji: '📦' }
    ],
    active: [],
    lastBackup: null
  });

  // Validate + normalise anything that claims to be a state
  function normalise(s) {
    if (!s || typeof s !== 'object' || !Array.isArray(s.tasks)) return null;
    const tasks = [];
    const seen = new Set();
    for (const t of s.tasks) {
      if (!t || typeof t.name !== 'string' || !t.name.trim()) continue;
      const id = typeof t.id === 'string' && t.id && !seen.has(t.id) ? t.id : uid();
      seen.add(id);
      tasks.push({ id, name: t.name.trim().slice(0, 120), emoji: typeof t.emoji === 'string' ? t.emoji.slice(0, 16) : '' });
    }
    const active = [];
    const activeSeen = new Set();
    for (const a of Array.isArray(s.active) ? s.active : []) {
      if (!a || !seen.has(a.id) || activeSeen.has(a.id)) continue;
      activeSeen.add(a.id);
      active.push({ id: a.id, note: typeof a.note === 'string' ? a.note.slice(0, 300) : '' });
    }
    return {
      v: 1,
      updated: Number(s.updated) || 0,
      tasks,
      active,
      lastBackup: typeof s.lastBackup === 'number' ? s.lastBackup : null
    };
  }

  function readLocal() {
    for (const k of [KEY, KEY_PREV]) {
      try {
        const raw = localStorage.getItem(k);
        if (raw) { const s = normalise(JSON.parse(raw)); if (s) return s; }
      } catch (e) {}
    }
    return null;
  }

  // IndexedDB mirror — second, independent copy
  let dbPromise = null;
  function db() {
    if (!dbPromise) {
      dbPromise = new Promise((res, rej) => {
        try {
          const r = indexedDB.open('haushaltsliste', 1);
          r.onupgradeneeded = () => r.result.createObjectStore('kv');
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        } catch (e) { rej(e); }
      });
      dbPromise.catch(() => {});
    }
    return dbPromise;
  }
  function idbSet(json) {
    return db().then(d => new Promise((res, rej) => {
      const tx = d.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(json, 'state');
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    })).catch(() => {});
  }
  function idbGet() {
    return db().then(d => new Promise((res) => {
      const tx = d.transaction('kv', 'readonly');
      const r = tx.objectStore('kv').get('state');
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => res(null);
    })).catch(() => null);
  }

  let state = readLocal() || defaults();
  let saveFailedShown = false;

  function save() {
    state.updated = Date.now();
    const json = JSON.stringify(state);
    try {
      const cur = localStorage.getItem(KEY);
      if (cur && cur !== json) localStorage.setItem(KEY_PREV, cur);
      localStorage.setItem(KEY, json);
      saveFailedShown = false;
    } catch (e) {
      if (!saveFailedShown) {
        saveFailedShown = true;
        toast('Speichern fehlgeschlagen – bitte Backup erstellen', null, true);
      }
    }
    idbSet(json);
  }

  // Flush on every chance the page might go away
  const flush = () => { try { save(); } catch (e) {} };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
  window.addEventListener('pagehide', flush);
  window.addEventListener('beforeunload', flush);

  // Sync if another tab changes it
  window.addEventListener('storage', (e) => {
    if (e.key !== KEY || !e.newValue) return;
    try {
      const s = normalise(JSON.parse(e.newValue));
      if (s && s.updated > state.updated) { state = s; render(); }
    } catch (err) {}
  });

  // Ask iOS/browser not to evict our storage
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

  // Reconcile with IndexedDB copy: whichever is newer wins
  idbGet().then(json => {
    let fromDb = null;
    try { fromDb = json ? normalise(JSON.parse(json)) : null; } catch (e) {}
    if (fromDb && fromDb.updated > state.updated) {
      state = fromDb;
      render();
    }
    save();
  });

  /* ---------- Helpers ---------- */
  const $ = (sel, root = document) => root.querySelector(sel);
  function el(tag, props = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') n.className = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (v === true) n.setAttribute(k, '');
      else if (v !== false && v != null) n.setAttribute(k, v);
    }
    for (const c of kids) if (c != null) n.append(c);
    return n;
  }
  const taskById = id => state.tasks.find(t => t.id === id);
  const isActive = id => state.active.some(a => a.id === id);
  function firstGrapheme(str) {
    str = (str || '').trim();
    if (!str) return '';
    if (window.Intl && Intl.Segmenter) {
      for (const { segment } of new Intl.Segmenter('de', { granularity: 'grapheme' }).segment(str)) return segment;
    }
    return Array.from(str).slice(0, 2).join('');
  }
  const emojiNode = e => el('span', { class: 'emoji' + (e ? '' : ' empty'), 'aria-hidden': 'true', text: e || '' });
  const fmtDate = ts => new Date(ts).toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' });

  /* ---------- Undo ---------- */
  let undoSnap = null;
  function snapshot() { undoSnap = JSON.stringify(state); }
  function undo() {
    if (!undoSnap) return;
    const s = normalise(JSON.parse(undoSnap));
    undoSnap = null;
    if (s) { state = s; save(); render(); }
    hideToast();
  }

  /* ---------- Toast ---------- */
  let toastEl = null, toastTimer = null;
  function hideToast() {
    clearTimeout(toastTimer);
    if (toastEl) { toastEl.remove(); toastEl = null; }
  }
  function toast(msg, withUndo, warn) {
    hideToast();
    toastEl = el('div', { class: 'toast' + (warn ? ' warn' : ''), role: 'status' },
      el('span', { text: msg }),
      withUndo ? el('button', { text: 'Rückgängig', onclick: undo }) : null
    );
    document.body.append(toastEl);
    toastTimer = setTimeout(() => { hideToast(); undoSnap = null; }, warn ? 7000 : 5000);
  }

  /* ---------- Actions ---------- */
  function activate(id) {
    snapshot();
    state.active.push({ id, note: '' });
    save(); render();
    toast('Auf die Liste gesetzt', true);
  }
  function complete(id) {
    snapshot();
    state.active = state.active.filter(a => a.id !== id);
    save(); render();
    toast('Erledigt', true);
  }
  function move(id, dir) {
    const i = state.tasks.findIndex(t => t.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= state.tasks.length) return;
    [state.tasks[i], state.tasks[j]] = [state.tasks[j], state.tasks[i]];
    save(); render();
  }

  /* ---------- Render ---------- */
  let editMode = false;
  const main = $('#main');
  const editBtn = $('#editBtn');

  function render() {
    // keep focus on a note field across re-renders (e.g. storage sync)
    const focused = document.activeElement && document.activeElement.dataset.noteFor;

    editBtn.classList.toggle('on', editMode);
    editBtn.innerHTML = editMode ? 'Fertig' : ICON.pencil;
    editBtn.setAttribute('aria-label', editMode ? 'Fertig' : 'Bearbeiten');

    main.replaceChildren(editMode ? renderEdit() : renderUse());

    if (focused) {
      const n = main.querySelector(`[data-note-for="${CSS.escape(focused)}"]`);
      if (n) { n.classList.remove('hidden'); n.focus(); }
    }
  }

  function renderUse() {
    const frag = document.createDocumentFragment();

    // Active
    frag.append(el('h2', { text: 'Zu erledigen' }));
    const activeList = state.active.map(a => ({ a, t: taskById(a.id) })).filter(x => x.t);
    if (!activeList.length) {
      frag.append(el('div', { class: 'empty-state', text: 'Gerade nichts offen' }));
    } else {
      const ul = el('ul', { class: 'active' });
      for (const { a, t } of activeList) {
        const note = el('input', {
          class: 'note hidden',
          type: 'text',
          placeholder: 'Notiz',
          enterkeyhint: 'done',
          autocomplete: 'off',
          'aria-label': 'Notiz zu ' + t.name,
          'data-note-for': t.id,
          maxlength: '300'
        });
        note.value = a.note || '';
        note.addEventListener('input', () => { a.note = note.value; save(); });
        note.addEventListener('change', () => { a.note = note.value; save(); });
        note.addEventListener('keydown', e => { if (e.key === 'Enter') note.blur(); });

        const noteText = el('span', { class: 'note-text' + (a.note ? '' : ' hidden'), text: a.note || '' });
        const main = el('button', { class: 'row main', 'aria-label': t.name + ' – erledigt (gedrückt halten für Notiz)' },
          emojiNode(t.emoji),
          el('span', { class: 'text' }, el('span', { class: 'name', text: t.name }), noteText)
        );
        const card = el('li', { class: 'card' },
          main,
          note
        );

        // Local DOM updates only (no full re-render) so a tap elsewhere on the card isn't swallowed
        let closedAt = 0;
        const openNote = () => {
          card.classList.remove('pressing');
          noteText.classList.add('hidden');
          note.classList.remove('hidden');
          note.focus();
        };
        note.addEventListener('blur', () => {
          closedAt = Date.now();
          a.note = note.value.trim();
          note.value = a.note;
          save();
          note.classList.add('hidden');
          noteText.textContent = a.note;
          noteText.classList.toggle('hidden', !a.note);
        });

        // Long press → note. Short tap → done.
        // The note opens on release (touchend/click) so iOS allows the keyboard to show.
        let timer = null, long = false, moved = false, sx = 0, sy = 0;
        const cancel = () => { clearTimeout(timer); timer = null; if (!long) card.classList.remove('pressing'); };
        main.addEventListener('pointerdown', e => {
          long = false; moved = false; sx = e.clientX; sy = e.clientY;
          clearTimeout(timer);
          timer = setTimeout(() => { long = true; card.classList.add('pressing'); }, 450);
        });
        main.addEventListener('pointermove', e => { if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) { moved = true; long = false; cancel(); } });
        main.addEventListener('pointerup', () => { clearTimeout(timer); });
        main.addEventListener('pointercancel', () => { long = false; cancel(); });
        main.addEventListener('contextmenu', e => e.preventDefault());
        main.addEventListener('touchend', e => {
          if (long) { e.preventDefault(); long = false; openNote(); }
        });
        main.addEventListener('click', () => {
          if (long) { long = false; openNote(); return; }
          if (moved) return;
          // a tap that only closes the note shouldn't also complete the task
          if (Date.now() - closedAt < 400) return;
          complete(t.id);
        });

        ul.append(card);
      }
      frag.append(ul);
    }

    // Pool
    frag.append(el('h2', { text: 'Alle Aufgaben' }));
    const pool = state.tasks.filter(t => !isActive(t.id));
    if (!pool.length) {
      frag.append(el('div', { class: 'empty-state', text: state.tasks.length ? 'Alles ist auf der Liste' : 'Noch keine Aufgaben' }));
    } else {
      const ul = el('ul', { class: 'pool' });
      for (const t of pool) {
        ul.append(el('li', { class: 'card' },
          el('button', { class: 'row', 'aria-label': t.name + ' – auf die Liste', onclick: () => activate(t.id) },
            emojiNode(t.emoji),
            el('span', { class: 'name', text: t.name }),
            el('span', { class: 'mark', html: ICON.plus })
          )
        ));
      }
      frag.append(ul);
    }
    return frag;
  }

  function renderEdit() {
    const frag = document.createDocumentFragment();
    frag.append(el('h2', { text: 'Aufgaben' }));

    if (state.tasks.length) {
      const ul = el('ul', { class: 'editList' });
      state.tasks.forEach((t, i) => {
        ul.append(el('li', { class: 'card' },
          el('div', { class: 'row' },
            el('button', { class: 'edit-open', 'aria-label': t.name + ' bearbeiten', onclick: () => openTaskSheet(t) },
              emojiNode(t.emoji),
              el('span', { class: 'name', text: t.name })
            ),
            el('button', { class: 'arrow', html: ICON.up, 'aria-label': 'Nach oben', disabled: i === 0, onclick: () => move(t.id, -1) }),
            el('button', { class: 'arrow', html: ICON.down, 'aria-label': 'Nach unten', disabled: i === state.tasks.length - 1, onclick: () => move(t.id, 1) })
          )
        ));
      });
      frag.append(ul);
    }

    frag.append(el('div', { style: 'margin-top:10px' },
      el('button', { class: 'btn dashed', onclick: () => openTaskSheet(null), html: ICON.plus + '<span>Neue Aufgabe</span>' })
    ));

    frag.append(el('h2', { text: 'Backup' }));
    frag.append(el('div', { class: 'btn-row' },
      el('button', { class: 'btn', onclick: exportBackup, html: ICON.save + '<span>Backup speichern</span>' }),
      el('button', { class: 'btn', onclick: () => $('#fileIn').click(), html: ICON.load + '<span>Backup laden</span>' })
    ));
    frag.append(el('p', { class: 'hint', text: state.lastBackup ? 'Letztes Backup am ' + fmtDate(state.lastBackup) : 'Noch kein Backup' }));
    return frag;
  }

  editBtn.addEventListener('click', () => {
    if (document.activeElement) document.activeElement.blur();
    editMode = !editMode;
    hideToast();
    render();
    window.scrollTo(0, 0);
  });

  /* ---------- Sheets ---------- */
  let sheetBackdrop = null;
  function openSheet(content) {
    closeSheet();
    const sheet = el('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true' }, content);
    sheetBackdrop = el('div', { class: 'backdrop' }, sheet);
    sheetBackdrop.addEventListener('click', e => { if (e.target === sheetBackdrop) closeSheet(); });
    document.body.append(sheetBackdrop);
    return sheet;
  }
  function closeSheet() {
    if (sheetBackdrop) { sheetBackdrop.remove(); sheetBackdrop = null; }
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  function openTaskSheet(task) {
    const isNew = !task;
    const emojiIn = el('input', { class: 'field emoji-in', type: 'text', placeholder: '🙂', 'aria-label': 'Symbol', autocomplete: 'off' });
    const nameIn = el('input', { class: 'field', type: 'text', placeholder: 'Aufgabe', 'aria-label': 'Name der Aufgabe', autocomplete: 'off', enterkeyhint: 'done', maxlength: '120' });
    emojiIn.value = task ? task.emoji : '';
    nameIn.value = task ? task.name : '';

    const saveBtn = el('button', { class: 'btn primary', text: 'Speichern' });
    const upd = () => { saveBtn.disabled = !nameIn.value.trim(); };
    nameIn.addEventListener('input', upd);
    emojiIn.addEventListener('input', () => {
      const g = firstGrapheme(emojiIn.value.slice(-8));
      // keep only the most recently typed symbol
      if (emojiIn.value !== g) emojiIn.value = g;
    });
    upd();

    const doSave = () => {
      const name = nameIn.value.trim();
      if (!name) return;
      const emoji = firstGrapheme(emojiIn.value);
      if (isNew) state.tasks.push({ id: uid(), name, emoji });
      else { const t = taskById(task.id); if (t) { t.name = name; t.emoji = emoji; } }
      save(); closeSheet(); render();
    };
    saveBtn.addEventListener('click', doSave);
    nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') doSave(); });

    const actions = el('div', { class: 'btn-row' }, saveBtn);
    if (!isNew) {
      let armed = false;
      const del = el('button', { class: 'btn danger', text: 'Löschen' });
      del.addEventListener('click', () => {
        if (!armed) { armed = true; del.classList.add('confirm'); del.textContent = 'Wirklich löschen?'; return; }
        snapshot();
        state.tasks = state.tasks.filter(t => t.id !== task.id);
        state.active = state.active.filter(a => a.id !== task.id);
        save(); closeSheet(); render();
        toast('Gelöscht', true);
      });
      actions.append(del);
    }
    actions.append(el('button', { class: 'btn ghost', text: 'Abbrechen', onclick: closeSheet }));

    openSheet(el('div', {},
      el('h3', { text: isNew ? 'Neue Aufgabe' : 'Aufgabe bearbeiten' }),
      el('div', { class: 'fields' }, emojiIn, nameIn),
      actions
    ));
    if (isNew) setTimeout(() => nameIn.focus(), 60);
  }

  function confirmSheet(title, text, okLabel, onOk) {
    openSheet(el('div', {},
      el('h3', { text: title }),
      text ? el('p', { text }) : null,
      el('div', { class: 'btn-row' },
        el('button', { class: 'btn primary', text: okLabel, onclick: () => { closeSheet(); onOk(); } }),
        el('button', { class: 'btn ghost', text: 'Abbrechen', onclick: closeSheet })
      )
    ));
  }

  /* ---------- Backup ---------- */
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  async function exportBackup() {
    save();
    const d = new Date();
    const stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const filename = `haushaltsliste-backup-${stamp}.json`;
    const data = JSON.stringify({ app: 'haushaltsliste', exported: d.toISOString(), state }, null, 2);

    const markDone = () => { state.lastBackup = Date.now(); save(); render(); toast('Backup gespeichert'); };

    // iOS: share sheet → „In Dateien sichern“ is the most reliable path
    if (isIOS && navigator.canShare) {
      try {
        const file = new File([data], filename, { type: 'application/json' });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
          markDone();
          return;
        }
      } catch (e) {
        if (e && e.name === 'AbortError') return;
      }
    }
    try {
      const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      const a = el('a', { href: url, download: filename });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      markDone();
    } catch (e) {
      toast('Backup fehlgeschlagen', null, true);
    }
  }

  const fileIn = $('#fileIn');
  fileIn.addEventListener('change', () => {
    const f = fileIn.files && fileIn.files[0];
    fileIn.value = '';
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      let s = null;
      try {
        const parsed = JSON.parse(reader.result);
        s = normalise(parsed && parsed.state ? parsed.state : parsed);
      } catch (e) {}
      if (!s) { toast('Datei ist kein gültiges Backup', null, true); return; }
      const n = s.tasks.length;
      confirmSheet('Backup laden?', `Die aktuelle Liste wird durch das Backup ersetzt (${n} ${n === 1 ? 'Aufgabe' : 'Aufgaben'}).`, 'Laden', () => {
        snapshot();
        state = s;
        save(); render();
        toast('Backup geladen', true);
      });
    };
    reader.onerror = () => toast('Datei konnte nicht gelesen werden', null, true);
    reader.readAsText(f);
  });

  /* ---------- Install hint (iOS Safari, not yet on home screen) ---------- */
  const standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  let hintClosed = false;
  try { hintClosed = localStorage.getItem(KEY_INSTALL) === '1'; } catch (e) {}
  if (isIOS && !standalone && !hintClosed) $('#install').classList.remove('hidden');
  $('#installClose').addEventListener('click', () => {
    $('#install').classList.add('hidden');
    try { localStorage.setItem(KEY_INSTALL, '1'); } catch (e) {}
  });

  /* ---------- Home-screen icon (generated, keeps this a single file) ---------- */
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 180;
    const g = c.getContext('2d');
    g.fillStyle = '#4f8a73';
    g.fillRect(0, 0, 180, 180);
    g.strokeStyle = '#ffffff';
    g.lineWidth = 17;
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.beginPath();
    g.moveTo(50, 94); g.lineTo(78, 122); g.lineTo(132, 62);
    g.stroke();
    $('#touchIcon').href = c.toDataURL('image/png');
  } catch (e) {}

  /* ---------- Optional offline support (only if sw.js sits next to this file) ---------- */
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  render();
  if (!state.updated) save();
})();
</script>
</body>
</html>
